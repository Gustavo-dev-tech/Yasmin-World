<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Feliz Aniversário!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <div id="score">Memórias: 0 / 5</div>
        <div id="message-box" class="hidden">
            <p id="message-text">Encontrou uma lembrança!</p>
            <button id="btn-open">Ver Foto</button>
        </div>
    </div>

    <div id="debug-panel" class="hidden"></div>

    <div id="joystick-zone"></div>

    <!-- Botoeira de Ações do Celular -->
    <div id="actions-panel">
        <button class="btn-action" onclick="window.triggerAnim('dance')">✨ Dançar</button>
        <button class="btn-action" onclick="window.triggerAnim('victory')">🎉 Comemorar</button>
        <button class="btn-action" onclick="window.triggerAnim('excited')">🤩 Animada</button>
        <button class="btn-action" onclick="window.triggerAnim('idle_dwarf')">🧘 Postura Dwarf</button>
        <button class="btn-action" onclick="window.triggerAnim('victory')">Vitoria</button>
        <button class="btn-action" onclick="window.triggerAnim('hiphop')">Hiphop</button>
        <button class="btn-action" onclick="window.triggerAnim('falling')">Caindo</button>
        
    </div>

    <div id="photo-modal" class="hidden">
        <img id="photo-display" src="" alt="Sua foto aparecerá aqui">
        <p id="photo-caption">Coloque a foto real na pasta assets/photos e edite no código!</p>
        <button id="btn-close-photo">Guardar na Memória</button>
    </div>

    <div id="victory-modal" class="hidden">
        <h1>🎉 Parabéns! 🎉</h1>
        <p>Você encontrou todas as memórias!</p>
        <button id="btn-restart">Jogar novamente</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
